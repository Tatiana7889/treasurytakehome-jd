services:
  - type: web
    name: ttb-label-review-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: Cors__AllowedOrigins__0
        value: https://ttb-label-review-ui.onrender.com
      # Only needed if you wire up a vision fallback provider later.
      # Leaving Gemini__ApiKey unset makes GeminiVisionFallbackService
      # no-op back to OCR-only results.

  - type: web
    name: ttb-label-review-ui
    runtime: docker
    dockerfilePath: ./ttb-label-review-ui/Dockerfile
    dockerContext: ./ttb-label-review-ui
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://ttb-label-review-api.onrender.com
