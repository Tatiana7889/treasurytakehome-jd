server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: unknown paths (client-side routes) serve index.html
        # instead of a 404, so refreshing on a deep link still works.
        try_files $uri $uri/ /index.html;
    }
}
